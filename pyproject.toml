[tool.ruff]
target-version = "py310"
line-length = 110
include = ["trading/**/*.py", "tools/*.py", "tests/*.py", "entry_policy.py", "execution_safety.py"]
exclude = [".tools", "scratch", "data", "logs"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Retain legacy intermediate calculations during mechanical extraction.
"trading/application/*.py" = ["F841"]

[tool.mypy]
python_version = "3.10"
files = ["trading"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".tools/mypy_cache"

[[tool.mypy.overrides]]
module = ["trading.models", "trading.ports", "trading.configuration", "trading.domain.indicators", "trading.domain.states"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true
